server:
  host: "0.0.0.0"
  port: 11434
  debug: false
  read_timeout: 60
  write_timeout: 60

backends:
  - name: "openai"
    api_key: "sk-your-openai-api-key-here"  # 请替换为您的实际 API 密钥
    base_url: "https://api.openai.com/v1"
    model_url: "https://api.openai.com/v1/models"
    enabled: true
    timeout: 30
    priority: 1
    model_prefix:
      enabled: true
      prefix: "openai"
      separator: "/"
      override: false

models:
  # Auto-fetch all models from OpenAI with prefix
  - name: "*"
    backend: "openai"
    capabilities: ["completion", "tools"]
    enabled: true

logging:
  level: "info"
  format: "json"
  file: "logs/app.log"
  max_size: 100
  max_backups: 7
  max_age: 30
  compress: true

database:
  path: "metrics.db"
  max_connections: 10
  connection_timeout: 30