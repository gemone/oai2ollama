server:
  host: "0.0.0.0"
  port: 11434
  debug: false
  read_timeout: 60
  write_timeout: 60

backends:
  # ZAI Backend with Chinese default prompt
  - name: "zai"
    api_key: "REPLACE_WITH_YOUR_ACTUAL_API_KEY"
    base_url: "https://open.bigmodel.cn/api/coding/paas/v4"
    model_url: "https://open.bigmodel.cn/api/paas/v4"
    enabled: true
    timeout: 30
    priority: 1
    model_prefix:
      enabled: true
      prefix: "glm"
      separator: "/"
      override: false
    default_prompt:
      enabled: true
      prompt: "请用中文回答用户的问题，提供专业和有用的信息。"

  # OpenAI Backend with English default prompt
  - name: "openai"
    api_key: "REPLACE_WITH_YOUR_ACTUAL_API_KEY"
    base_url: "https://api.openai.com/v1"
    model_url: "https://api.openai.com/v1/models"
    enabled: false
    timeout: 30
    priority: 2
    model_prefix:
      enabled: true
      prefix: "gpt"
      separator: "-"
      override: false
    default_prompt:
      enabled: true
      prompt: "Please provide a helpful and accurate response to the user's question."

  # Claude Backend without default prompt
  - name: "claude"
    api_key: "REPLACE_WITH_YOUR_ACTUAL_API_KEY"
    base_url: "https://api.anthropic.com/v1"
    model_url: "https://api.anthropic.com/v1/models"
    enabled: false
    timeout: 30
    priority: 3
    model_prefix:
      enabled: true
      prefix: "claude"
      separator: "-"
      override: false
    # No default prompt configured - will reject empty prompts

models:
  # Auto-fetch all models from enabled backends (wildcard configuration)
  - name: "*"
    backend: "zai"
    capabilities: ["completion", "tools", "thinking"]
    enabled: true
    # Default parameter ranges for auto-fetched models
    temperature:
      enabled: true
      min: 0.0
      max: 2.0
    top_p:
      enabled: true
      min: 0.0
      max: 1.0
    presence_penalty:
      min: -2.0
      max: 2.0
    frequency_penalty:
      min: -2.0
      max: 2.0

  # Custom model aliases - these will be added as additional entries if the original model exists in backend
  - name: "chat-glm4"  # Custom alias
    backend: "zai"
    original_name: "glm-4.5"  # Points to the actual model in backend
    capabilities: ["completion", "tools"]
    enabled: true
    max_tokens: 8192
    # Model-specific parameter ranges with enable switches
    temperature:
      enabled: true
      min: 0.1
      max: 1.5
    top_p:
      enabled: false  # Disable top_p for this model - external values will be ignored
      min: 0.1
      max: 0.9
    presence_penalty:
      min: -1.0
      max: 1.0
    frequency_penalty:
      min: -1.0
      max: 1.0

  - name: "advanced-glm"  # Another custom alias
    backend: "zai"
    original_name: "glm-4.5-air"
    capabilities: ["completion", "tools", "thinking"]
    enabled: true
    max_tokens: 131072
    # Model-specific parameter ranges for advanced model
    temperature:
      enabled: true
      min: 0.0
      max: 2.0
    top_p:
      enabled: true
      min: 0.0
      max: 1.0
    presence_penalty:
      min: -2.0
      max: 2.0
    frequency_penalty:
      min: -2.0
      max: 2.0

  # Example model with both temperature and top_p disabled
  - name: "restricted-model"
    backend: "zai"
    original_name: "glm-4-flash"
    capabilities: ["completion"]
    enabled: true
    max_tokens: 4096
    # Disable external parameter control for consistent behavior
    temperature:
      enabled: false  # External temperature values will be ignored
      min: 0.5
      max: 0.8
    top_p:
      enabled: false  # External top_p values will be ignored
      min: 0.7
      max: 0.9

  # Example of custom model that doesn't exist (will be skipped with warning after verification)
  - name: "nonexistent-model"
    backend: "zai"
    original_name: "model-that-does-not-exist"
    capabilities: ["completion"]
    enabled: true

  # Example of custom model with wrong backend (will be skipped with warning)
  - name: "test-gpt"
    backend: "openai"  # Backend is disabled
    original_name: "gpt-4"
    capabilities: ["completion"]
    enabled: true

logging:
  level: "info"
  format: "json"
  file: "logs/app.log"
  max_size: 100
  max_backups: 7
  max_age: 30
  compress: true

database:
  path: "metrics.db"
  max_connections: 10
  connection_timeout: 30

