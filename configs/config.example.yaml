server:
  host: "0.0.0.0"
  port: 11434
  debug: false
  read_timeout: 60
  write_timeout: 60

backends:
  # ZAI Backend with Chinese default prompt
  - name: "zai"
    api_key: "REPLACE_WITH_YOUR_ACTUAL_API_KEY"
    base_url: "https://open.bigmodel.cn/api/coding/paas/v4"
    model_url: "https://open.bigmodel.cn/api/paas/v4"
    enabled: true
    timeout: 30
    priority: 1
    model_prefix:
      enabled: true
      prefix: "glm"
      separator: "/"
      override: false
    default_prompt:
      enabled: true
      prompt: "请用中文回答用户的问题，提供专业和有用的信息。"

  # OpenAI Backend with English default prompt
  - name: "openai"
    api_key: "REPLACE_WITH_YOUR_ACTUAL_API_KEY"
    base_url: "https://api.openai.com/v1"
    model_url: "https://api.openai.com/v1/models"
    enabled: false
    timeout: 30
    priority: 2
    model_prefix:
      enabled: true
      prefix: "gpt"
      separator: "-"
      override: false
    default_prompt:
      enabled: true
      prompt: "Please provide a helpful and accurate response to the user's question."

  # Claude Backend without default prompt
  - name: "claude"
    api_key: "REPLACE_WITH_YOUR_ACTUAL_API_KEY"
    base_url: "https://api.anthropic.com/v1"
    model_url: "https://api.anthropic.com/v1/models"
    enabled: false
    timeout: 30
    priority: 3
    model_prefix:
      enabled: true
      prefix: "claude"
      separator: "-"
      override: false
    # No default prompt configured - will reject empty prompts

models:
  # Auto-fetch all models from enabled backends
  - name: "*"
    backend: "zai"
    capabilities: ["completion", "tools", "thinking"]
    enabled: true

  - name: "*"
    backend: "openai"
    capabilities: ["completion", "tools", "function_calling"]
    enabled: true

  - name: "*"
    backend: "claude"
    capabilities: ["completion", "tools", "analysis"]
    enabled: true

logging:
  level: "info"
  format: "json"
  file: "logs/app.log"
  max_size: 100
  max_backups: 7
  max_age: 30
  compress: true

database:
  path: "metrics.db"
  max_connections: 10
  connection_timeout: 30