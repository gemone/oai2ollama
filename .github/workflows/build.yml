name: Build Multi-Platform Static Binaries

on:
  push:
    branches: [ with-go ]
  pull_request:
    branches: [ with-go ]
  release:
    types: [ published ]
  workflow_dispatch:

env:
  GO_VERSION: '1.24'

jobs:
  build:
    name: Build for ${{ matrix.os }}/${{ matrix.arch }}
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        include:
          # Linux
          - os: linux
            arch: amd64
            output: oai2ollama-go-linux-amd64
          - os: linux
            arch: arm64
            output: oai2ollama-go-linux-arm64
          - os: linux
            arch: 386
            output: oai2ollama-go-linux-386
          
          # macOS
          - os: darwin
            arch: amd64
            output: oai2ollama-go-darwin-amd64
          - os: darwin
            arch: arm64
            output: oai2ollama-go-darwin-arm64
          
          # Windows
          - os: windows
            arch: amd64
            output: oai2ollama-go-windows-amd64.exe
          - os: windows
            arch: 386
            output: oai2ollama-go-windows-386.exe
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: ${{ env.GO_VERSION }}
        
    - name: Cache Go modules
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-
          
    - name: Download dependencies
      run: |
        go mod download
        go mod tidy
        
    - name: Run tests
      run: go test -v ./...
      
    - name: Build binary
      env:
        GOOS: ${{ matrix.os }}
        GOARCH: ${{ matrix.arch }}
        CGO_ENABLED: 0
      run: |
        mkdir -p bin
        go build \
          -ldflags="-w -s -X main.version=${{ github.ref_name }} -X main.commit=${{ github.sha }} -X main.date=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
          -o bin/${{ matrix.output }} \
          ./cmd/oai2ollama
          
    - name: Upload binary artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.output }}
        path: bin/${{ matrix.output }}
        retention-days: 30

  build-release:
    name: Create Release Assets
    runs-on: ubuntu-latest
    needs: build
    if: github.event_name == 'release'
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Create release directory
      run: mkdir -p release
      
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: release
        
    - name: Create tar.gz archives for Unix-like systems
      run: |
        cd release
        # Linux archives
        tar -czf oai2ollama-go-linux-amd64.tar.gz oai2ollama-go-linux-amd64
        tar -czf oai2ollama-go-linux-arm64.tar.gz oai2ollama-go-linux-arm64
        tar -czf oai2ollama-go-linux-386.tar.gz oai2ollama-go-linux-386
        
        # macOS archives
        tar -czf oai2ollama-go-darwin-amd64.tar.gz oai2ollama-go-darwin-amd64
        tar -czf oai2ollama-go-darwin-arm64.tar.gz oai2ollama-go-darwin-arm64
        
        # Windows archives
        tar -czf oai2ollama-go-windows-amd64.tar.gz oai2ollama-go-windows-amd64.exe
        tar -czf oai2ollama-go-windows-386.tar.gz oai2ollama-go-windows-386.exe
        
        # Create checksums
        sha256sum *.tar.gz > checksums.txt
        
    - name: Upload release assets
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release/*.tar.gz
          release/checksums.txt
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  notify:
    name: Notify Build Status
    runs-on: ubuntu-latest
    needs: [build, build-release]
    if: always()
    
    steps:
    - name: Build Summary
      run: |
        echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
        echo "- **Build Status**: ${{ needs.build.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Release Status**: ${{ needs.build-release.result }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
        echo "- **Branch**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY